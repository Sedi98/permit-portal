services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  operator:
    build:
      context: .
      dockerfile: apps/operator/Dockerfile
    env_file:
      - ./apps/operator/.env
    ports:
      - "5050:80"
    restart: unless-stopped
